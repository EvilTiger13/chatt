<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatt</title>
<style>
  :root {
    --bg: #1d2a2f; --panel: #243539; --line: #34494e; --hover: #2c3f44;
    --text: #e6ecea; --muted: #8fa5a3; --me: #3d7a6e; --them: #2e4247; --accent: #f2c14e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.45 "Segoe UI", system-ui, sans-serif; }
  button { background: var(--accent); color: #1d2a2f; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.plain { background: none; color: var(--muted); padding: 6px 8px; font-weight: 400; }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit; width: 100%; }
  input:focus-visible, button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .error { color: #ff9b85; font-size: 14px; min-height: 20px; margin: 0; }

  /* Inloggning */
  #auth { height: 100vh; display: grid; place-items: center; padding: 20px; }
  #auth form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  #auth h1 { margin: 0 0 4px; font-size: 32px; }
  #auth p.lead { margin: 0 0 8px; color: var(--muted); }
  label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  /* Appen */
  #app { height: 100vh; display: grid; grid-template-columns: 300px 1fr; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex;
    flex-direction: column; min-height: 0; }
  .me { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex;
    justify-content: space-between; align-items: center; }
  .me strong { display: block; }
  .me small, .row small { color: var(--muted); }
  .search { padding: 12px 16px; }
  .list { flex: 1; overflow-y: auto; }
  .list h2 { font-size: 14px; font-weight: 400; color: var(--muted); margin: 8px 16px; }
  .row { display: block; width: 100%; text-align: left; background: none; color: var(--text);
    border-radius: 0; padding: 10px 16px; font-weight: 400; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--hover); box-shadow: inset 3px 0 var(--accent); }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row .preview { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { color: var(--muted); padding: 8px 16px; font-size: 14px; }

  main { display: flex; flex-direction: column; min-height: 0; }
  .chat-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .chat-head small { color: var(--muted); }
  #back { display: none; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; background: var(--them);
    align-self: flex-start; white-space: pre-wrap; word-wrap: break-word; }
  .msg.mine { background: var(--me); align-self: flex-end; }
  .msg time { display: block; font-size: 11px; color: var(--muted); text-align: right; }
  .msg.mine time { color: #cfe3de; }
  .empty { margin: auto; color: var(--muted); text-align: center; padding: 20px; }
  #send { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }

  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; }
    #app.chatting aside { display: none; }
    #app:not(.chatting) main { display: none; }
    #back { display: inline-block; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>

<section id="auth">
  <form id="auth-form">
    <h1>Chatt</h1>
    <p class="lead" id="auth-lead">Logga in för att fortsätta.</p>
    <label id="name-field" class="hidden">Ditt namn
      <input id="f-name" maxlength="40" autocomplete="name">
    </label>
    <label>Användarnamn
      <input id="f-user" maxlength="20" autocomplete="username" required>
    </label>
    <label>Lösenord
      <input id="f-pass" type="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="auth-error"></p>
    <button type="submit" id="auth-submit">Logga in</button>
    <button type="button" class="plain" id="auth-toggle">Nytt här? Skapa konto</button>
  </form>
</section>

<section id="app" class="hidden">
  <aside>
    <div class="me">
      <div><strong id="me-name"></strong><small id="me-user"></small></div>
      <button class="plain" id="logout">Logga ut</button>
    </div>
    <div class="search"><input id="search" placeholder="Sök användarnamn" autocomplete="off"></div>
    <div class="list">
      <div id="results" class="hidden"></div>
      <div id="convos"></div>
    </div>
  </aside>
  <main>
    <div class="chat-head">
      <button class="plain" id="back" aria-label="Tillbaka">←</button>
      <div><strong id="chat-name">Ingen chatt vald</strong> <small id="chat-user"></small></div>
    </div>
    <div id="messages"><p class="empty">Sök efter ett användarnamn till vänster för att starta en chatt.</p></div>
    <form id="send" class="hidden">
      <input id="text" placeholder="Skriv ett meddelande" maxlength="2000" autocomplete="off" required>
      <button type="submit">Skicka</button>
    </form>
  </main>
</section>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('token');
let me = null;
let current = null;   // användarnamn i öppen chatt
let socket = null;
let registering = false;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) },
    body: body && JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Något gick fel');
  return data;
}

function fmtTime(iso) {
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
}

/* ---------- Inloggning / registrering ---------- */
$('auth-toggle').onclick = () => {
  registering = !registering;
  $('name-field').classList.toggle('hidden', !registering);
  $('f-name').required = registering;
  $('auth-lead').textContent = registering ? 'Skapa ett konto. Andra hittar dig via ditt användarnamn.' : 'Logga in för att fortsätta.';
  $('auth-submit').textContent = registering ? 'Skapa konto' : 'Logga in';
  $('auth-toggle').textContent = registering ? 'Har du redan konto? Logga in' : 'Nytt här? Skapa konto';
  $('auth-error').textContent = '';
};

$('auth-form').onsubmit = async (e) => {
  e.preventDefault();
  $('auth-error').textContent = '';
  try {
    const body = { username: $('f-user').value, password: $('f-pass').value };
    if (registering) body.displayName = $('f-name').value;
    const data = await api(registering ? '/api/register' : '/api/login', body);
    token = data.token;
    localStorage.setItem('token', token);
    start(data.user);
  } catch (err) { $('auth-error').textContent = err.message; }
};

$('logout').onclick = async () => {
  try { await api('/api/logout', {}); } catch {}
  localStorage.removeItem('token');
  location.reload();
};

/* ---------- Appen ---------- */
function start(user) {
  me = user;
  $('me-name').textContent = me.displayName;
  $('me-user').textContent = '@' + me.username;
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  loadConvos();
  connect();
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${proto}://${location.host}/?token=${token}`);
  socket.onmessage = (e) => {
    const m = JSON.parse(e.data);
    const other = m.sender === me.username ? m.recipient : m.sender;
    if (other === current) addMessage(m);
    loadConvos();
  };
  socket.onclose = (e) => { if (e.code !== 4001) setTimeout(connect, 2000); };
}

function userRow(u, extra = '') {
  const b = document.createElement('button');
  b.className = 'row' + (u.username === current ? ' active' : '');
  b.innerHTML = '<div class="top"><span class="n"></span><small class="t"></small></div><div class="preview"></div>';
  b.querySelector('.n').textContent = u.displayName;
  b.querySelector('.preview').textContent = extra || '@' + u.username;
  if (u.lastTime) b.querySelector('.t').textContent = fmtTime(u.lastTime);
  b.onclick = () => openChat(u.username);
  return b;
}

async function loadConvos() {
  const list = await api('/api/conversations');
  const box = $('convos');
  box.innerHTML = '<h2>Chattar</h2>';
  if (!list.length) box.insertAdjacentHTML('beforeend', '<p class="hint">Inga chattar än. Sök efter någons användarnamn ovan.</p>');
  list.forEach((c) => box.appendChild(userRow(c, c.lastText)));
}

let searchTimer;
$('search').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const term = $('search').value.trim();
    const box = $('results');
    if (!term) { box.classList.add('hidden'); return; }
    const users = await api('/api/search?q=' + encodeURIComponent(term));
    box.innerHTML = '<h2>Sökresultat</h2>';
    if (!users.length) box.insertAdjacentHTML('beforeend', '<p class="hint">Ingen användare hittades.</p>');
    users.forEach((u) => box.appendChild(userRow(u)));
    box.classList.remove('hidden');
  }, 250);
};

async function openChat(username) {
  current = username;
  const data = await api('/api/messages/' + username);
  $('chat-name').textContent = data.user.displayName;
  $('chat-user').textContent = '@' + data.user.username;
  $('messages').innerHTML = '';
  if (!data.messages.length) $('messages').innerHTML = '<p class="empty">Inga meddelanden än. Säg hej!</p>';
  data.messages.forEach(addMessage);
  $('send').classList.remove('hidden');
  $('app').classList.add('chatting');
  $('search').value = '';
  $('results').classList.add('hidden');
  loadConvos();
  $('text').focus();
}

function addMessage(m) {
  $('messages').querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg' + (m.sender === me.username ? ' mine' : '');
  el.textContent = m.text;
  const t = document.createElement('time');
  t.textContent = fmtTime(m.time);
  el.appendChild(t);
  $('messages').appendChild(el);
  $('messages').scrollTop = $('messages').scrollHeight;
}

$('send').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !current) return;
  socket.send(JSON.stringify({ to: current, text }));
  $('text').value = '';
};

$('back').onclick = () => { $('app').classList.remove('chatting'); current = null; loadConvos(); };

/* ---------- Start: redan inloggad? ---------- */
if (token) api('/api/me').then(start).catch(() => localStorage.removeItem('token'));
</script>
</body>
</html>
