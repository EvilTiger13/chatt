name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera beroenden
        run: npm install

      - name: Kör tester
        run: npm test

      - name: Bygg Docker-image
        run: docker build -t chatt:${{ github.sha }} .
